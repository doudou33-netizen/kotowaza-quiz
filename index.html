<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ことわざクイズ</title>
<link rel="icon" href="IMG_0091.png">
<link rel="apple-touch-icon" href="IMG_0091.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ことわざクイズ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEDC;
    --card:#FBF8ED;
    --ink:#262220;
    --ink-soft:#5b544c;
    --indigo:#233A5E;
    --indigo-deep:#182842;
    --vermilion:#B33B2B;
    --gold:#C79A3A;
    --line:#D8CFB8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(35,58,94,0.05), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(179,59,43,0.05), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:max(20px, env(safe-area-inset-top)) 20px 28px;
    position:relative;
    z-index:1;
  }

  ruby{ ruby-align:center; }
  rt{
    font-size:.55em;
    font-family:"Zen Kaku Gothic New", sans-serif;
    color:var(--ink-soft);
    font-weight:400;
    letter-spacing:0;
  }
  .choice rt{ color:inherit; opacity:.65; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--indigo);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  header h1{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.04em;
    margin:0;
    color:var(--indigo-deep);
  }
  #progress-label{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  #progress-track{
    height:4px;
    background:var(--line);
    border-radius:2px;
    margin-bottom:26px;
    overflow:hidden;
  }
  #progress-fill{
    height:100%;
    background:var(--vermilion);
    width:0%;
    transition:width .35s ease;
  }

  main{flex:1; display:flex; flex-direction:column;}

  #q-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--indigo);
    border-radius:4px;
    padding:26px 22px;
    box-shadow:0 1px 0 rgba(38,34,32,.04);
    margin-bottom:22px;
  }
  #q-eyebrow{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  #q-meaning{
    font-family:"Shippori Mincho", serif;
    font-size:19px;
    line-height:2.15;
    margin:0;
    color:var(--ink);
  }

  #choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:15px 16px;
    font-family:"Shippori Mincho", serif;
    font-size:17px;
    line-height:1.9;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .choice:active{transform:scale(.99);}
  .choice .mark{
    flex:none;
    width:26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .choice:not(.locked):hover{border-color:var(--indigo);}
  .choice.correct{ background:#F4EDE3; border-color:var(--vermilion); }
  .choice.correct .mark{ background:var(--vermilion); border-color:var(--vermilion); color:#fff; }
  .choice.wrong{ border-color:var(--ink-soft); opacity:.6; }
  .choice.wrong .mark{ background:var(--ink-soft); border-color:var(--ink-soft); color:#fff; }
  .choice.dim{opacity:.45;}
  .choice.locked{cursor:default;}

  #feedback{
    min-height:20px;
    margin:16px 2px 0;
    font-size:14px;
    line-height:1.8;
    color:var(--indigo-deep);
    display:none;
  }
  #feedback.show{display:block;}

  #next-btn{
    margin-top:18px;
    width:100%;
    background:var(--indigo-deep);
    color:#F3EEDC;
    border:none;
    border-radius:4px;
    padding:15px;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.02em;
    cursor:pointer;
    display:none;
  }
  #next-btn.show{display:block;}
  #next-btn:active{background:var(--indigo);}

  .screen{
    flex:1;
    display:none;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:20px;
  }
  .screen.show{display:flex;}
  .screen h2{
    font-family:"Shippori Mincho", serif;
    font-size:24px;
    color:var(--indigo-deep);
    margin:0;
  }
  .screen p{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.9;
    margin:0;
  }
  .big-btn{
    background:var(--indigo-deep);
    color:#F3EEDC;
    border:none;
    border-radius:4px;
    padding:16px;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  .big-btn:active{background:var(--indigo);}
  .ghost-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
  }

  #result-badge{
    font-size:54px;
    line-height:1;
  }
  #result-score{
    font-family:"Shippori Mincho", serif;
    font-size:48px;
    color:var(--vermilion);
    font-weight:700;
    line-height:1;
  }
  #result-score span{
    font-size:19px;
    color:var(--ink-soft);
    font-family:"Zen Kaku Gothic New", sans-serif;
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    top:-16px;
    width:9px;
    height:15px;
    opacity:.95;
    pointer-events:none;
    z-index:50;
    animation-name:confetti-fall;
    animation-timing-function:cubic-bezier(.35,0,.65,1);
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(112vh) rotate(600deg); opacity:0; }
  }
  #result-badge.pop{ animation:pop-in .5s cubic-bezier(.3,1.4,.4,1); }
  @keyframes pop-in{
    0%{ transform:scale(.3); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>ことわざクイズ</h1>
    <span id="progress-label"></span>
  </header>
  <div id="progress-track"><div id="progress-fill"></div></div>

  <main>

    <section class="screen show" id="screen-start">
      <h2>意味からことわざを当てよう</h2>
      <p>ことわざの「意味」が出るので、<br>合うことわざを４つの中から選んでね。<br>101このことわざの中から、毎回ランダムで10問出るよ。</p>
      <button class="big-btn" id="start-btn">はじめる</button>
    </section>

    <section id="screen-quiz">
      <div id="q-card">
        <p id="q-eyebrow">この意味を表することわざは？</p>
        <p id="q-meaning"></p>
      </div>
      <div id="choices"></div>
      <p id="feedback"></p>
      <button id="next-btn">つぎへ</button>
    </section>

    <section class="screen" id="screen-result">
      <div id="result-badge"></div>
      <h2 id="result-title">けっか発表</h2>
      <div id="result-score" style="display:none;">0<span>/ 10問</span></div>
      <p id="result-comment"></p>
      <button class="big-btn" id="result-primary-btn"></button>
      <button class="ghost-btn" id="result-secondary-btn">さいしょからやり直す</button>
    </section>

  </main>
</div>

<script>
/* ---------------- 101 elementary-level kotowaza (with furigana as 漢字(かんじ)) ---------------- */
const DATA = [
["猿(さる)も木(き)から落(お)ちる","どんなに得意(とくい)なことでも、失敗(しっぱい)することがあるということ。"],
["石(いし)の上(うえ)にも三年(さんねん)","つらくても我慢(がまん)して続(つづ)ければ、いつか成功(せいこう)するということ。"],
["犬(いぬ)も歩(ある)けば棒(ぼう)に当(あ)たる","何(なに)かをすれば、思(おも)いがけない出来事(できごと)に出会(であ)うということ。"],
["花(はな)より団子(だんご)","見(み)た目(め)の美(うつく)しさより、実際(じっさい)に役立(やくだ)つものの方(ほう)がよいということ。"],
["早起(はやお)きは三文(さんもん)の徳(とく)","朝早(あさはや)く起(お)きると、良(よ)いことがあるということ。"],
["三度目(さんどめ)の正直(しょうじき)","一度(いちど)や二度(にど)失敗(しっぱい)しても、三回目(さんかいめ)にはうまくいくということ。"],
["二階(にかい)から目薬(めぐすり)","物事(ものごと)が思(おも)うようにいかず、もどかしいことのたとえ。"],
["蛙(かえる)の子(こ)は蛙(かえる)","子(こ)どもは結局(けっきょく)、親(おや)に似(に)るものだということ。"],
["亀(かめ)の甲(こう)より年(とし)の功(こう)","年上(としうえ)の人(ひと)の長年(ながねん)の経験(けいけん)や知恵(ちえ)は貴重(きちょう)だということ。"],
["灯台(とうだい)下(もと)暗(くら)し","身近(みぢか)なことは、かえって気(き)づきにくいということ。"],
["火(ひ)のない所(ところ)に煙(けむり)は立(た)たぬ","何(なん)の根拠(こんきょ)もないのに、うわさは立(た)たないということ。"],
["七転(ななころ)び八起(やお)き","何度(なんど)失敗(しっぱい)しても、あきらめずに立(た)ち直(なお)ること。"],
["塵(ちり)も積(つ)もれば山(やま)となる","小(ちい)さなものでも、たくさん集(あつ)まれば大(おお)きくなるということ。"],
["転(ころ)ばぬ先(さき)の杖(つえ)","失敗(しっぱい)しないように、前(まえ)もって準備(じゅんび)しておくこと。"],
["二兎(にと)を追(お)う者(もの)は一兎(いっと)をも得(え)ず","欲(よく)を出(だ)して二(ふた)つのことを同時(どうじ)にしようとすると、どちらも失敗(しっぱい)するということ。"],
["猫(ねこ)に小判(こばん)","価値(かち)のわからない人(ひと)に、貴重(きちょう)なものを与(あた)えても意味(いみ)がないこと。"],
["馬(うま)の耳(みみ)に念仏(ねんぶつ)","いくら意見(いけん)を言(い)っても、まったく効(き)き目(め)がないこと。"],
["豚(ぶた)に真珠(しんじゅ)","値打(ねう)ちがわからない人(ひと)に、大切(たいせつ)なものを与(あた)えても無駄(むだ)だということ。"],
["井(い)の中(なか)の蛙(かわず)大海(たいかい)を知(し)らず","せまい世界(せかい)にいて、広(ひろ)い世界(せかい)のことを知(し)らないこと。"],
["百聞(ひゃくぶん)は一見(いっけん)に如(し)かず","人(ひと)から何度(なんど)も聞(き)くより、一度(いちど)自分(じぶん)の目(め)で見(み)る方(ほう)がよくわかるということ。"],
["継続(けいぞく)は力(ちから)なり","一(ひと)つのことを続(つづ)けることが、大(おお)きな力(ちから)になるということ。"],
["光陰矢(こういんや)の如(ごと)し","月日(つきひ)が経(た)つのは、矢(や)のようにとても速(はや)いということ。"],
["案(あん)ずるより産(う)むが易(やす)し","あれこれ心配(しんぱい)するより、やってみると意外(いがい)と簡単(かんたん)だということ。"],
["急(いそ)がば回(まわ)れ","急(いそ)いでいる時(とき)ほど、遠(とお)くても安全(あんぜん)な道(みち)を選(えら)んだ方(ほう)がよいということ。"],
["果報(かほう)は寝(ね)て待(ま)て","あせらずに、良(よ)い時期(じき)が来(く)るのをのんびり待(ま)つのがよいということ。"],
["棚(たな)からぼた餅(もち)","思(おも)いがけない幸運(こううん)が舞(ま)い込(こ)んでくること。"],
["一石二鳥(いっせきにちょう)","一(ひと)つのことをして、同時(どうじ)に二(ふた)つの利益(りえき)を得(え)ること。"],
["千里(せんり)の道(みち)も一歩(いっぽ)から","どんな大(おお)きなことも、まずは小(ちい)さな一歩(いっぽ)から始(はじ)まるということ。"],
["雨降(あめふ)って地固(じかた)まる","もめごとの後(あと)、かえって物事(ものごと)がうまく収(おさ)まるということ。"],
["蒔(ま)かぬ種(たね)は生(は)えぬ","何(なに)もしなければ、良(よ)い結果(けっか)は得(え)られないということ。"],
["出(で)る杭(くい)は打(う)たれる","目立(めだ)つ人(ひと)は、他人(たにん)から非難(ひなん)されたり邪魔(じゃま)されたりしやすいということ。"],
["知(し)らぬが仏(ほとけ)","知(し)らないでいれば、心穏(こころおだ)やかでいられるということ。"],
["覆水盆(ふくすいぼん)に返(かえ)らず","一度(いちど)してしまったことは、もう取(と)り返(かえ)しがつかないということ。"],
["良薬(りょうやく)は口(くち)に苦(にが)し","本当(ほんとう)に役立(やくだ)つ忠告(ちゅうこく)ほど、聞(き)くのがつらいということ。"],
["三人寄(さんにんよ)れば文殊(もんじゅ)の知恵(ちえ)","凡人(ぼんじん)でも三人(さんにん)集(あつ)まって考(かんが)えれば、良(よ)い知恵(ちえ)が浮(う)かぶということ。"],
["木(き)を見(み)て森(もり)を見(み)ず","小(ちい)さな部分(ぶぶん)にとらわれて、全体(ぜんたい)を見失(みうしな)うこと。"],
["好(す)きこそ物(もの)の上手(じょうず)なれ","好(す)きなことは、熱心(ねっしん)に励(はげ)むので上達(じょうたつ)するということ。"],
["立(た)つ鳥(とり)跡(あと)を濁(にご)さず","立(た)ち去(さ)る者(もの)は、あとが見苦(みぐる)しくないよう始末(しまつ)をしておくべきだということ。"],
["弘法(こうぼう)にも筆(ふで)の誤(あやま)り","どんな名人(めいじん)でも、時(とき)には失敗(しっぱい)することがあるということ。"],
["河童(かっぱ)の川流(かわなが)れ","その道(みち)の名人(めいじん)でも、時(とき)には失敗(しっぱい)することがあるということ。"],
["明日(あした)は明日(あした)の風(かぜ)が吹(ふ)く","先(さき)のことを心配(しんぱい)しても仕方(しかた)がない、なんとかなるということ。"],
["一寸(いっすん)の虫(むし)にも五分(ごぶ)の魂(たましい)","どんなに小(ちい)さく弱(よわ)い者(もの)にも、それなりの意地(いじ)や考(かんが)えがあるということ。"],
["蓼食(たでく)う虫(むし)も好(す)き好(ず)き","人(ひと)の好(この)みはさまざまで、変(か)わったものを好(この)む人(ひと)もいるということ。"],
["蛇(じゃ)の道(みち)は蛇(へび)","同(おな)じ仲間(なかま)のことは、その道(みち)の者(もの)がよく知(し)っているということ。"],
["隣(となり)の芝生(しばふ)は青(あお)い","他人(たにん)のものは、自分(じぶん)のものより良(よ)く見(み)えるということ。"],
["泣(な)き面(つら)に蜂(はち)","悪(わる)いことの上(うえ)に、さらに悪(わる)いことが重(かさ)なること。"],
["弱(よわ)り目(め)に祟(たた)り目(め)","困(こま)っている時(とき)に、さらに困(こま)ったことが重(かさ)なること。"],
["二度(にど)あることは三度(さんど)ある","同(おな)じようなことは、繰(く)り返(かえ)し起(お)こりやすいということ。"],
["習(なら)うより慣(な)れろ","人(ひと)から教(おそ)わるより、実際(じっさい)にやって慣(な)れる方(ほう)が身(み)につくということ。"],
["石橋(いしばし)を叩(たた)いて渡(わた)る","用心(ようじん)の上(うえ)にも用心(ようじん)を重(かさ)ねて、物事(ものごと)を行(おこな)うこと。"],
["温故知新(おんこちしん)","昔(むかし)のことを学(まな)び直(なお)して、新(あたら)しい知識(ちしき)や考(かんが)えを見(み)つけること。"],
["一(いち)を聞(き)いて十(じゅう)を知(し)る","少(すこ)し聞(き)いただけで、全体(ぜんたい)を理解(りかい)してしまうほど賢(かしこ)いこと。"],
["過(す)ぎたるは猶(なお)及(およ)ばざるが如(ごと)し","やりすぎることは、足(た)りないことと同(おな)じくらい良(よ)くないということ。"],
["老(お)いては子(こ)に従(したが)え","年(とし)をとったら、子(こ)どもの意見(いけん)に従(したが)うのがよいということ。"],
["会(あ)うは別(わか)れの始(はじ)め","出会(であ)った人(ひと)とは、いつか必(かなら)ず別(わか)れが来(く)るということ。"],
["青(あお)は藍(あい)より出(い)でて藍(あい)より青(あお)し","弟子(でし)が師匠(ししょう)より優(すぐ)れた人(ひと)になることのたとえ。"],
["朱(しゅ)に交(まじ)われば赤(あか)くなる","つきあう人(ひと)によって、良(よ)くも悪(わる)くも影響(えいきょう)を受(う)けるということ。"],
["類(るい)は友(とも)を呼(よ)ぶ","気(き)の合(あ)う者(もの)や似(に)た者(もの)同士(どうし)は、自然(しぜん)と集(あつ)まるということ。"],
["我(わ)が身(み)をつねって人(ひと)の痛(いた)さを知(し)れ","自分(じぶん)がつらい思(おも)いをして、初(はじ)めて他人(たにん)の痛(いた)みがわかるということ。"],
["情(なさ)けは人(ひと)のためならず","人(ひと)に親切(しんせつ)にすれば、めぐりめぐって自分(じぶん)に返(かえ)ってくるということ。"],
["因果応報(いんがおうほう)","良(よ)い行(おこな)いにも悪(わる)い行(おこな)いにも、それに応(おう)じた報(むく)いがあるということ。"],
["善(ぜん)は急(いそ)げ","良(よ)いと思(おも)ったことは、迷(まよ)わずすぐに行動(こうどう)するのがよいということ。"],
["思(おも)い立(た)ったが吉日(きちじつ)","何(なに)かをしようと思(おも)ったら、その日(ひ)をよい日(ひ)として、すぐ始(はじ)めるのがよいということ。"],
["焼(や)け石(いし)に水(みず)","わずかな努力(どりょく)や援助(えんじょ)では、効果(こうか)がほとんどないこと。"],
["骨折(ほねお)り損(ぞん)のくたびれ儲(もう)け","苦労(くろう)しただけで、何(なん)の得(とく)にもならないこと。"],

["論(ろん)より証拠(しょうこ)","あれこれ議論(ぎろん)するより、証拠(しょうこ)を示(しめ)す方(ほう)が確(たし)かだということ。"],
["損(そん)して得(とく)取(と)れ","目先(めさき)の損(そん)を気(き)にせず、あとで大(おお)きな得(とく)を得(え)るようにすること。"],
["急(せ)いては事(こと)を仕損(しそん)じる","慌(あわ)てて物事(ものごと)を行(おこな)うと、失敗(しっぱい)しやすいということ。"],
["腐(くさ)っても鯛(たい)","本当(ほんとう)にすぐれたものは、悪(わる)くなったり古(ふる)くなったりしても、それなりの価値(かち)を保(たも)っているということ。"],
["医者(いしゃ)の不養生(ふようじょう)","人(ひと)には立派(りっぱ)なことを言(い)うのに、自分(じぶん)では実行(じっこう)できていないことのたとえ。"]
];

const QUESTIONS = DATA.map(([p,m]) => ({p, m}));
const ROUND_SIZE = 10;

/* ---------------- furigana renderer: 漢字(かんじ) -> <ruby> ---------------- */
function rb(text){
  return text.replace(/([\u4E00-\u9FFF\u3005]+)\(([\u3041-\u3096\u30FC]+)\)/g,
    '<ruby>$1<rt>$2</rt></ruby>');
}

/* ---------------- state ---------------- */
let sessionQuestions = [];
let sessionIdx = 0;
let sessionWrong = [];
let isReviewMode = false;
let mainScore = null;
let answered = false;

/* ---------------- elements ---------------- */
const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');
const progressLabel = document.getElementById('progress-label');
const progressFill = document.getElementById('progress-fill');
const qMeaning = document.getElementById('q-meaning');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const resultBadge = document.getElementById('result-badge');
const resultTitle = document.getElementById('result-title');
const resultScore = document.getElementById('result-score');
const resultComment = document.getElementById('result-comment');
const primaryBtn = document.getElementById('result-primary-btn');
const secondaryBtn = document.getElementById('result-secondary-btn');

document.getElementById('start-btn').addEventListener('click', startNewGame);
secondaryBtn.addEventListener('click', startNewGame);
nextBtn.addEventListener('click', nextQuestion);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function show(screen){
  [screenStart, screenQuiz, screenResult].forEach(s => s.classList.remove('show'));
  screen.classList.add('show');
}

function startNewGame(){
  sessionQuestions = shuffle(QUESTIONS).slice(0, ROUND_SIZE);
  sessionIdx = 0;
  sessionWrong = [];
  isReviewMode = false;
  mainScore = null;
  show(screenQuiz);
  renderQuestion();
}

function startReview(qs){
  sessionQuestions = shuffle(qs);
  sessionIdx = 0;
  sessionWrong = [];
  isReviewMode = true;
  show(screenQuiz);
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  feedbackEl.classList.remove('show');
  nextBtn.classList.remove('show');

  const q = sessionQuestions[sessionIdx];
  const prefix = isReviewMode ? '復習 ' : '';
  progressLabel.textContent = prefix + (sessionIdx+1) + ' / ' + sessionQuestions.length;
  progressFill.style.width = ((sessionIdx)/sessionQuestions.length*100) + '%';
  qMeaning.innerHTML = rb(q.m);

  const distractorPool = QUESTIONS.filter(x => x.p !== q.p).map(x => x.p);
  const distractors = shuffle(distractorPool).slice(0,3);
  const options = shuffle([q.p, ...distractors]);
  const labels = ['ア','イ','ウ','エ'];

  choicesEl.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.dataset.proverb = opt;
    btn.innerHTML = '<span class="mark">' + labels[i] + '</span><span>' + rb(opt) + '</span>';
    btn.addEventListener('click', () => selectAnswer(btn, opt, q));
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(btn, chosen, q){
  if(answered) return;
  answered = true;

  const isCorrect = chosen === q.p;
  if(!isCorrect){
    sessionWrong.push(q);
  }

  [...choicesEl.children].forEach(c => {
    c.classList.add('locked');
    if(c.dataset.proverb === q.p) c.classList.add('correct');
    else if(c !== btn) c.classList.add('dim');
  });
  if(!isCorrect) btn.classList.add('wrong');

  feedbackEl.innerHTML = isCorrect
    ? '正解！「' + rb(q.p) + '」'
    : '残念、正しくは「' + rb(q.p) + '」';
  feedbackEl.classList.add('show');
  nextBtn.classList.add('show');
  nextBtn.textContent = (sessionIdx === sessionQuestions.length-1) ? '結果を見る' : 'つぎへ';
}

function nextQuestion(){
  sessionIdx++;
  if(sessionIdx >= sessionQuestions.length){
    finishRound();
  } else {
    renderQuestion();
  }
}

function finishRound(){
  progressFill.style.width = '100%';

  if(!isReviewMode){
    mainScore = sessionQuestions.length - sessionWrong.length;
    showMainResult(mainScore, sessionQuestions.length);
  } else if(sessionWrong.length === 0){
    showClearedResult();
  } else {
    showContinueReview();
  }
}

function showMainResult(score, total){
  resultTitle.textContent = 'けっか発表';
  resultScore.style.display = 'block';
  resultScore.innerHTML = score + '<span>/ ' + total + '問</span>';

  let comment, badge, confettiCount;
  if(score === total){
    badge = '🏆'; comment = 'パーフェクト！ことわざ博士だね！';
    confettiCount = 70;
  } else if(score >= 7){
    badge = '🎉'; comment = 'すごい！よくがんばりました！';
    confettiCount = 40;
  } else if(score >= 4){
    badge = '😊'; comment = 'いいちょうし！つぎもがんばろう！';
    confettiCount = 20;
  } else {
    badge = '🌱'; comment = 'ここからぐんぐん伸びるよ！応援してるよ！';
    confettiCount = 10;
  }
  resultBadge.textContent = badge;
  resultComment.textContent = comment;
  launchConfetti(confettiCount);
  bounceBadge();

  if(sessionWrong.length > 0){
    const wrongSet = sessionWrong.slice();
    primaryBtn.textContent = 'まちがえた問題(' + wrongSet.length + '問)に挑戦';
    primaryBtn.onclick = () => startReview(wrongSet);
  } else {
    primaryBtn.textContent = 'もう一度10問に挑戦';
    primaryBtn.onclick = startNewGame;
  }
  show(screenResult);
}

function showContinueReview(){
  resultTitle.textContent = 'もう少し！';
  resultScore.style.display = 'none';
  resultBadge.textContent = '💪';
  resultComment.textContent = 'まだ ' + sessionWrong.length + '問 のこっているよ。もう一度挑戦しよう！';
  bounceBadge();

  const wrongSet = sessionWrong.slice();
  primaryBtn.textContent = 'のこり' + wrongSet.length + '問に挑戦';
  primaryBtn.onclick = () => startReview(wrongSet);
  show(screenResult);
}

function showClearedResult(){
  resultTitle.textContent = '全問クリア！';
  resultScore.style.display = 'none';
  resultBadge.textContent = '🎊';
  resultComment.textContent = '最初は10問中 ' + mainScore + '問正解だったけど、復習して全部おぼえられたね！';
  launchConfetti(55);
  bounceBadge();

  primaryBtn.textContent = 'もう一度10問に挑戦';
  primaryBtn.onclick = startNewGame;
  show(screenResult);
}

function bounceBadge(){
  resultBadge.classList.remove('pop');
  void resultBadge.offsetWidth;
  resultBadge.classList.add('pop');
}

function launchConfetti(count){
  const colors = ['#233A5E','#B33B2B','#C79A3A','#5b544c'];
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const duration = 2.4 + Math.random()*1.6;
    const delay = Math.random()*0.4;
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = delay + 's';
    piece.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration+delay)*1000 + 100);
  }
}
</script>
